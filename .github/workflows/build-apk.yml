name: 打包 Zone Mail APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the Android SDK pieces AGP 8.5.2 / compileSdk 34 actually needs.
      # android-actions/setup-android@v3 defaults to installing the
      # obsolete 'tools' package, which no longer exists and makes
      # sdkmanager exit 1 (seen 2026-11-14, run #6).
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: 构建 Debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: 改名
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/zone-mail.apk

      - name: 发布到 Release（latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zone Mail 最新版
          files: android/app/build/outputs/apk/debug/zone-mail.apk
